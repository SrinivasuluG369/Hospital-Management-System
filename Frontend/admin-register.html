<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Registration</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="header">

    <div class="logo-section">

        <img src="images/logo.png"
             alt="Hospital Logo"
             class="logo">

        <div>

            <h1>Srinivasa Multispeciality Hospital</h1>

            <p>Admin Registration</p>

        </div>

    </div>

</header>

<nav class="navbar">

    <a href="index.html">Home</a>

    <a href="patient-register.html">
        Patient Registration
    </a>

    <a href="doctor-register.html">
        Doctor Registration
    </a>

    <a href="admin-register.html"
       class="active">
        Admin Registration
    </a>

    <a href="login.html">
        Login
    </a>

</nav>

<div class="container form-container">

<form action="admin-dashboard.html"
      method="post">

    <h2>Admin Registration</h2>


    <label for="adminName">
        Full Name:
    </label>

    <input type="text"
           id="adminName"
           name="adminName"
           placeholder="Enter admin name"
           required>


    <label for="designation">
        Designation:
    </label>

    <input type="text"
           id="designation"
           name="designation"
           placeholder="Enter designation"
           required>


    <label for="adminEmail">
        Email:
    </label>

    <input type="email"
           id="adminEmail"
           name="adminEmail"
           placeholder="Enter email"
           required>


    <label for="adminPhone">
        Phone:
    </label>

    <input type="tel"
           id="adminPhone"
           name="adminPhone"
           placeholder="Enter phone number">


    <label for="adminUsername">
        Username:
    </label>

    <input type="text"
           id="adminUsername"
           name="adminUsername"
           placeholder="Create username"
           required>


    <label for="adminPassword">
        Password:
    </label>

    <input type="password"
           id="adminPassword"
           name="adminPassword"
           placeholder="Create password"
           required>


    <label for="adminConfirmPassword">
        Confirm Password:
    </label>

    <input type="password"
           id="adminConfirmPassword"
           name="adminConfirmPassword"
           placeholder="Confirm password"
           required>


    <div class="btn-group">

        <button type="submit">
            Register
        </button>

        <button type="reset">
            Reset
        </button>

    </div>

</form>

</div>

<footer class="footer">

    <p>
        © 2026 Srinivasa Multispeciality Hospital
    </p>

</footer>
<script src="js/script.js"></script>
</body>

</html>
