<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="header">

    <div class="logo-section">

        <img src="images/logo.png"
             alt="Hospital Logo"
             class="logo">

        <div>

            <h1>Srinivasa Multispeciality Hospital</h1>

            <p>Contact Us</p>

        </div>

    </div>

</header>

<nav class="navbar">

    <a href="index.html">
        Home
    </a>

    <a href="about.html">
        About
    </a>

    <a href="contact.html"
       class="active">
        Contact
    </a>

    <a href="login.html">
        Login
    </a>

</nav>

<section class="services">

    <h2>Contact Information</h2>

    <div class="service-container">

        <div class="service-card">

            <h3>📍 Address</h3>

            <p>
                Srinivasa Multispeciality Hospital
                <br>
                Main Road
                <br>
                Andhra Pradesh, India
            </p>

        </div>


        <div class="service-card">

            <h3>📞 Phone</h3>

            <p>
                +91 98765 43210
            </p>

        </div>


        <div class="service-card">

            <h3>📧 Email</h3>

            <p>
                info@srinivasahospital.com
            </p>

        </div>

    </div>

</section>

<div class="container form-container">

<form action="#" method="post">

    <h2>Send Us a Message</h2>

    <label for="name">
        Name:
    </label>

    <input type="text"
           id="name"
           name="name"
           placeholder="Enter your name"
           required>


    <label for="email">
        Email:
    </label>

    <input type="email"
           id="email"
           name="email"
           placeholder="Enter your email"
           required>


    <label for="message">
        Message:
    </label>

    <textarea id="message"
              name="message"
              rows="5"
              placeholder="Enter your message"
              required></textarea>


    <button type="submit">
        Send Message
    </button>

</form>

</div>

<footer class="footer">

    <p>
        © 2026 Srinivasa Multispeciality Hospital
    </p>

</footer>
<script src="js/script.js"></script>
</body>

</html>
